name: Build CV

on:
  push:
    paths:
      - 'CV_BOGDAN_EN_short.tex'
      - 'moderncvcolorpink.sty'
      - 'ID_BOGDAN.pdf'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: CV_BOGDAN_EN_short.tex

      - name: Commit PDF
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add CV_BOGDAN_EN_short.pdf
          git diff --staged --quiet || git commit -m "ci: rebuild CV PDF"
          git push
